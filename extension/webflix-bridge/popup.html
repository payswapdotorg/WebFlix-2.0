<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
      .dot.ok { background: #1db954; } .dot.warn { background: #e0a416; } .dot.bad { background: #e50914; }
      #detail { font-size: 11px; opacity: .7; white-space: pre-wrap; margin: 6px 0; }
      button { padding: 6px 10px; border-radius: 6px; border: 0; background: #e50914; color: #fff; font-weight: 600; cursor: pointer; margin-right: 6px; }
      a { color: inherit; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span> WebFlix Bridge</h1>
    <div id="detail">Loading…</div>
    <button id="push">Push session now</button>
    <a href="#" id="open-options">Options</a>
    <script src="popup.js" type="module"></script>
  </body>
</html>
